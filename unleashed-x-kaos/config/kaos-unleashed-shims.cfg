#####################################################################
# Unleashed x KAOS — shims for excluded modules
#####################################################################
# Leaving a KAOS module out is not just "don't copy the file". kaos.cfg and
# kaos_menu.cfg still reference the macros that module defined, and a missing
# macro turns a menu button into "Unknown command" and makes the boot restore
# chain throw on every single start.
#
# Editing kaos_menu.cfg to remove the entries would work but is fragile — it is
# a ~90-section file and the surgery would have to be redone after every
# KAOS_UPDATE. Shimming is stable: upstream files stay untouched and only the
# externally-referenced entry points are replaced.
#
# RULE for adding a shim: after excluding a module, grep the rest of the KAOS
# tree for every macro that module defined. Every hit from OUTSIDE the module
# needs a stub here.
#
# Included by the sideload AFTER kaos.cfg, so these definitions win.
#####################################################################

#####################################################################
# Currently: no shims required.
#####################################################################
# The allowlist deliberately avoids fully excluding any module the menu or the
# loader reaches into:
#
#   kaos_fans.cfg    -> INCLUDED, only its [temperature_fan board_fan] section
#                       stripped. An earlier draft excluded it outright, which
#                       would have broken two external references:
#                         _KAOS_SET_BOARD_FAN_CTRL          <- kaos_menu.cfg
#                         _KAOS_LOAD_PERSISTED_FAN_OPTIONS  <- kaos.cfg (+0.5 s)
#                       Keeping the module and stripping only the section is
#                       cleaner than stubbing both. Our PID fan stays in charge;
#                       KAOS's fan logic ships present-but-off
#                       (enable_board_fan_ctrl = 0).
#
#   magic_ams_by_chris.cfg -> EXCLUDED, and safe to exclude: nothing in
#                       kaos_menu.cfg references TOOLCHANGE or ORCA_PURGE, so
#                       no menu entry is left dangling.
#
#   kaos_system_prep.cfg -> not included by upstream main any more, and not
#                       menu-exposed.
#
# This file therefore stays empty on purpose. It exists so the mechanism is
# documented and ready the moment an exclusion does strand a referenced macro —
# which a future KAOS_UPDATE can introduce at any time.
