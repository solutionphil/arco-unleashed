#####################################################################
# Unleashed x KAOS — trust wiring
#####################################################################
# KAOS's motion guard installs ARMED: it refuses every X/Y/Z travel until trust
# is granted, and _SET_TRUSTED_XYZ is the only thing that grants it. The guard
# cannot observe the Unleashed base's SET_KINEMATIC_POSITION-based homed state on
# its own, and the base's homing path never calls into KAOS.
#
# Without this file: homing reports success, and then the FIRST travel move after
# it is refused. That reads as a dead printer, with no obvious cause. It is the
# single biggest failure mode of a naive KAOS install on this base.
#
# Everything KAOS-specific lives HERE, not in the kit. The kit only offers a
# generic, KAOS-agnostic extension point (_ARCO_POST_HOME_HOOK, called at the end
# of [homing_override]); this file is what fills it in. That split is deliberate:
# the base must know nothing about the overlay, so that removing the overlay
# leaves nothing behind to clean up.
#
# Installed and included by scripts/kaos-sideload.sh, and removed again by
# KAOS_OFF together with the other bridge files.
#####################################################################

# --- Grant: fill in the kit's post-home hook ----------------------------
# [homing_override] is a Klipper SECTION, so it cannot be wrapped with
# rename_existing the way a macro can — the kit's hook is the only clean way in.
# The kit calls this only on the success path, so reaching it means a real home
# completed.
#
# Scope note inherited from the kit: its override is `axes: z`, so this fires for
# G28 and G28 Z but never for G28 X / G28 Y. Axis-only homes therefore do not
# grant trust. Documented rather than worked around — widening the kit's `axes:`
# would change homing behaviour on a load-cell-probed machine.
[gcode_macro _ARCO_POST_HOME_HOOK]
description: Grant KAOS motion-guard trust after a successful home
gcode:
    {% if printer["gcode_macro _SET_TRUSTED_XYZ"] is defined %}
        _SET_TRUSTED_XYZ
    {% else %}
        # Guard installed but its trust macros are missing — a partial install.
        # Say so loudly: silently skipping would leave every travel blocked.
        RESPOND PREFIX=KAOS MSG="post-home hook ran but _SET_TRUSTED_XYZ is missing - KAOS install looks incomplete, motion will stay blocked."
    {% endif %}

# --- Clear trust on motors-off: deliberately NOT done here --------------
# An earlier version wrapped M84 to clear trust. That was wrong twice over, and
# removing it is the correct answer, not a workaround:
#
# 1. You cannot wrap a macro the base already defines by declaring a second
#    [gcode_macro M84]. Klipper parses with strict=False, so the two same-named
#    sections MERGE (last include wins per option) rather than one wrapping the
#    other — Phrozen's real M84 body (stepper disable + SET_KINEMATIC_POSITION)
#    would simply be replaced by ours. And a traditional command (M84) may only
#    rename_existing to another traditional name (M84.1), never to an extended
#    one (_ARCO_M84_BASE): "rename of different types" aborts config load.
#
# 2. On the Arco, M84 does not actually un-home the machine. Phrozen's M84 runs
#    SET_KINEMATIC_POSITION, so Klipper still reports the axes homed afterwards
#    (the voronFDM Z-fix relies on this). Clearing KAOS trust on M84 would put
#    KAOS out of step with Klipper's own homed_axes — less correct, not more.
#
# So trust is granted on a successful home (above) and otherwise starts
# un-granted at boot (the guard installs armed). A failed home never reaches the
# grant, so it correctly leaves the machine untrusted. If a future base ever
# makes M84 genuinely un-home, add the clear by patching Phrozen's M84 body
# kit-side (a guarded apply-config-patches.sh edit), not by a second macro here.

#####################################################################
# _TRUSTED_AXIS_HOME — the per-axis half of KAOS's trust state
#####################################################################
# KAOS tracks trust twice: _TRUSTED_HOME holds the combined xy/z/xyz flags, and
# _TRUSTED_AXIS_HOME holds one flag per axis so that a home of X alone can be
# remembered until Y follows. kaos_safety.cfg — which this bridge DOES deploy —
# writes to both. Upstream defines the combined one in kaos_safety.cfg and the
# per-axis one in printer_gcode_macro.cfg, and that second file is the one this
# bridge refuses to install: KAOS's copy would replace Phrozen's wholesale and
# take [include AddOn.cfg], and every Unleashed feature, with it.
#
# The result was a live defect, measured 2026-08-05: _CLEAR_TRUSTED_HOME fails
# with "The value '_TRUSTED_AXIS_HOME' is not valid for MACRO" and aborts before
# it reaches KAOS_MOTION_GUARD_CLEAR_TRUST — so the one macro whose job is to
# revoke trust cannot complete. Nothing calls it today, which is the only reason
# it went unnoticed; a KAOS update that adds a caller would arm it.
#
# Declaring it here rather than patching kaos_safety.cfg keeps upstream's file
# untouched, and it disappears with KAOS_OFF because this whole file does.
[gcode_macro _TRUSTED_AXIS_HOME]
variable_x: 0
variable_y: 0
variable_z: 0
gcode:
