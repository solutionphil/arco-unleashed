#####################################################################
# Unleashed x KAOS — console bridge
#####################################################################
# Provides KAOS_ON / KAOS_OFF / KAOS_UPDATE / KAOS_STATUS in the
# Mainsail/Fluidd console. All the real work happens in
# scripts/kaos-sideload.sh; these macros are only a safe front door.
#
# Include this from printer.cfg (or your AddOn overlay):
#     [include kaos-bridge.cfg]
#
# Requires gcode_shell_command. This package ships its own copy so it
# does not depend on any other kit being installed — see the install
# notes in README.md.
#####################################################################

[gcode_shell_command kaos_sideload]
# The bridge lives inside the kit since 2026-08-05 (it used to sit beside it at
# ~/unleashed-x-kaos). One location means a kit update carries it along by itself,
# whichever way that update arrives -- git, USB tarball, or a fresh image.
command: /home/mks/arco-unleashed/unleashed-x-kaos/scripts/kaos-sideload.sh
timeout: 600.0
verbose: True

#####################################################################
# Guard — every KAOS_* action restarts Klipper, so never mid-print.
#####################################################################
[gcode_macro _KAOS_BRIDGE_GUARD]
description: Refuse KAOS bridge actions while a print is running or paused
gcode:
    {% set st = printer.print_stats.state|default('standby') %}
    {% if st in ['printing', 'paused'] %}
        { action_raise_error(
            "KAOS bridge: refusing while a print is %s. These commands restart Klipper — "
            "run them from an idle printer." % st) }
    {% endif %}

#####################################################################
# Public commands
#####################################################################
[gcode_macro KAOS_ON]
description: Install (if needed) and activate the KAOS package, then restart Klipper
gcode:
    _KAOS_BRIDGE_GUARD
    RESPOND PREFIX=KAOS MSG="activating - this will restart Klipper when done"
    # magic_ams ships ON by default (as it is in upstream KAOS). Say so here rather than
    # letting the purge quietly change under someone who only asked for the menu and the
    # fans. A magic_ams choice persisted from a shell (KAOS_MAGIC_AMS=0) is not overridden here.
    {% if printer.save_variables.variables.ams|default(0)|int == 1 %}
        RESPOND PREFIX=KAOS MSG="includes magic_ams: colour changes will use KAOS's ORCA_PURGE instead of the stock spit. MAGIC_AMS_STAGE STAGE=1 keeps the proven purge; MAGIC_AMS_OFF removes the feature."
    {% endif %}
    RUN_SHELL_COMMAND CMD=kaos_sideload PARAMS="on"

[gcode_macro KAOS_OFF]
description: Deactivate KAOS (files stay cached for an instant re-activation), then restart Klipper
gcode:
    _KAOS_BRIDGE_GUARD
    RESPOND PREFIX=KAOS MSG="deactivating - cached files are kept for KAOS_ON"
    RUN_SHELL_COMMAND CMD=kaos_sideload PARAMS="off"

# KAOS_UPDATE               -> main, the released version
# KAOS_UPDATE BRANCH=name   -> that branch or tag, for trying an upstream fix before release
#
# BRANCH=name rather than a bare word: Klipper's gcode parser only accepts KEY=VALUE, so
# "KAOS_UPDATE somebranch" would silently arrive with no parameters at all and quietly pull main.
#
# The choice is NOT remembered. A plain KAOS_UPDATE always means the released version, so nobody
# ends up running a branch they forgot they picked, and "which code is on my printer" has one
# answer. The two guards after the fetch already refuse a branch whose tree is not a KAOS tree.
[gcode_macro KAOS_UPDATE]
description: Fetch the latest KAOS files (BRANCH=x for a branch other than main)
gcode:
    _KAOS_BRIDGE_GUARD
    {% set b = params.BRANCH|default('')|string %}
    {% if b == '' %}
        RESPOND PREFIX=KAOS MSG="updating from main - needs network access"
        RUN_SHELL_COMMAND CMD=kaos_sideload PARAMS="update"
    {% else %}
        RESPOND PREFIX=KAOS MSG="updating from branch '{b}' - needs network access. A plain KAOS_UPDATE returns to main."
        RUN_SHELL_COMMAND CMD=kaos_sideload PARAMS="update {b}"
    {% endif %}

[gcode_macro KAOS_STATUS]
description: Report whether KAOS is active, which version is installed, and the last action
gcode:
    RUN_SHELL_COMMAND CMD=kaos_sideload PARAMS="status"


# THERE IS NO MAGIC_AMS_ON / MAGIC_AMS_OFF ANY MORE. magic_ams comes with KAOS: KAOS_ON installs it,
# KAOS_OFF takes it out again -- includes removed AND the spit patch reverted, so "off" really is
# off. The two macros only ever covered one case, KAOS with an AMS but without the purge rewrite,
# and nobody ever asked for it. Upstream KAOS has no such switch either.
#
# The escape hatch survives for the case that turns up anyway: KAOS_MAGIC_AMS=0 in front of the
# sideload, or `kaos-sideload.sh magic-off` from a shell. Both still work; they are simply not on
# the macro wall any more.


[gcode_macro MAGIC_AMS_STATUS]
description: Show whether magic_ams is installed and wired
gcode:
    {% set wired = printer["gcode_macro _TOOLCHANGE_PENDING"] is defined %}
    {% set ams = printer.save_variables.variables.ams|default(0)|int %}
    RESPOND PREFIX=KAOS MSG="magic_ams bridge loaded: {wired} | ams flag: {ams}"
    {% if wired and ams != 1 %}
        RESPOND PREFIX=KAOS MSG="note: ams=0, so tool changes fall back to M600 - magic_ams stays inert until an AMS is attached."
    {% endif %}
    RUN_SHELL_COMMAND CMD=kaos_sideload PARAMS="status"
