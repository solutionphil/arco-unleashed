#####################################################################
# Unleashed x KAOS — magic_ams state bridge + entry-point overrides
#####################################################################
# Purpose: let magic_ams_by_chris.cfg be installed VERBATIM, and route the Arco's
# own tool-change/spit flow through it — WITHOUT editing the kit. The kit stays
# byte-identical (unleashed = kein KAOS); everything KAOS lives here + the sideload.
#
# magic_ams expects three state macros that live only in KAOS's rewritten
# printer_gcode_macro.cfg — a file we deliberately do not adopt. Rather than forking
# magic_ams, we DECLARE the containers it reads and enrich them with our values.
# It populates most of that state itself (magic_ams_by_chris.cfg:78, :117-121), so
# these are containers to fill, not behaviour to reimplement. Variable NAMES must
# match KAOS's exactly (incl. `lifted` as a boolean).
#
# INCLUDE POSITION IS LOAD-BEARING. The sideload inserts this file's include AFTER
# [include AddOn.cfg] (unlike the other KAOS includes, which go before). Reason: we
# override PHROZEN_TOOLCHANGE by RE-DECLARING it, and Klipper resolves same-named
# [gcode_macro] sections by last-include-wins (strict=False merge). Included AFTER
# AddOn.cfg, our declaration wins; included before, the kit's would. This is exactly
# the G30 override mechanism (see the G30 note in AddOn.cfg) — NOT rename_existing,
# which cannot wrap a config-section macro (it only works on Python-registered
# commands like P114; two same-named sections merge and the rename target vanishes).
#
# Included by the sideload only when the magic_ams feature is enabled.
#####################################################################

# --- Geometry constants -------------------------------------------------
# Pure constants; KAOS reads them, nothing writes them at runtime.
# NOTE: KAOS ships g_spitting_start_x = 124 while the shared ancestor and our
# line both use 123.0. The purge kick is a deliberate contact move against the
# chute, so that 1 mm is not free — open question with upstream. We keep ours.
[gcode_macro PRZ_GEOMETRY]
variable_z_lift_safety_margin: 3
variable_toolchange_z_lift: 3
variable_safe_x_offset: 15
gcode:
    {% set _ = 0 %}

# --- Runtime state ------------------------------------------------------
# Mirrors of values Phrozen keeps in GLOBAL_PARAM. The defaults below are only
# ever seen before the first sync; _ARCO_KAOS_STATE_SYNC replaces them with the
# live values. They are NOT authoritative — never let them be read stale, which
# is exactly what a naive stub of this macro would do (it would silently hand
# back 205 / 254 / 254 on every colour change, with no error).
[gcode_macro PRZ_RUNTIME_STATE]
variable_target_extruder_temp: 205
variable_cooling_fan_speed: 254
variable_assist_fan_value: 254
gcode:
    {% set _ = 0 %}

# --- Tool-change handoff ------------------------------------------------
# Armed by our PHROZEN_TOOLCHANGE below, consumed by our PRZ_SPITTING_END below.
# Empty container only.
[gcode_macro _TOOLCHANGE_PENDING]
variable_active: 0
variable_flush: 0
variable_retract: 0
variable_lifted: 0
variable_next_temp: 0
# Ours, not KAOS's: the print clock at the moment the handoff was armed. Used to refuse a
# handoff that belongs to an earlier, cancelled print — see PRZ_SPITTING_END below.
variable_armed_at: 0
gcode:
    {% set _ = 0 %}

# --- The enrichment -----------------------------------------------------
# Copies Phrozen's live values into the state ORCA_PURGE restores at the end, so
# it restores the CURRENT temperature and fan speeds rather than the defaults.
# Phrozen populates GLOBAL_PARAM in PG103/PG104 at print start; the tool-change
# path never refreshes g_extruder_temperature — which is why every colour change
# after the first reuses the FIRST tool's temperature. Our PHROZEN_TOOLCHANGE
# supplies the slicer temp itself (TEMP param); this only refreshes the fans and
# the pre-slicer fallback.
[gcode_macro _ARCO_KAOS_STATE_SYNC]
description: Mirror Phrozen GLOBAL_PARAM values into the state magic_ams expects
gcode:
    {% if printer["gcode_macro GLOBAL_PARAM"] is defined %}
        {% set GP = printer["gcode_macro GLOBAL_PARAM"] %}
        SET_GCODE_VARIABLE MACRO=PRZ_RUNTIME_STATE VARIABLE=target_extruder_temp VALUE={GP.g_extruder_temperature}
        SET_GCODE_VARIABLE MACRO=PRZ_RUNTIME_STATE VARIABLE=cooling_fan_speed    VALUE={GP.g_extruder_fan_speed}
        SET_GCODE_VARIABLE MACRO=PRZ_RUNTIME_STATE VARIABLE=assist_fan_value     VALUE={GP.g_assist_fan_value}
    {% endif %}

# --- The entry point: PHROZEN_TOOLCHANGE (re-declared, wins by merge) -----
# Orca calls PHROZEN_TOOLCHANGE on every colour change. The kit's AddOn.cfg defines
# the stock version (P10 S1..S6 bucket / M600). Because this file is included AFTER
# AddOn.cfg, THIS declaration wins (last-include-wins) and fully replaces it while
# magic_ams is on. Toggle magic off -> this file is not included -> the kit's stock
# PHROZEN_TOOLCHANGE runs. No kit edit, no sed, no rename_existing.
#
# We DELIBERATELY do NOT route through KAOS's own TOOLCHANGE: it demands a NEXT
# parameter our slicer profile does not send, and it would double-purge on top of
# the firmware. We use only KAOS's ORCA_PURGE (fired from PRZ_SPITTING_END, below).
#
# ORCA SLICER PARAMETER STRING (locked):
#     change_filament_gcode = PHROZEN_TOOLCHANGE FLUSH=[flush_length] TEMP=[new_filament_temp]
#   * FLUSH  drives the purge VOLUME (ceil(flush/max_poop) poops). Required.
#   * TEMP   is the incoming tool's nozzle temp (the exact placeholder KAOS's own
#            TOOLCHANGE names: new_filament_temp). OPTIONAL — omit it and the purge
#            runs at the current print temp, correct for single-material multicolour.
#            Supply it only for material MIX (per-tool temperature). Unread when
#            magic_ams is off, so ONE profile serves every state with no re-slice.
#
# NO STAGING ANY MORE. There used to be a magic_stage variable with a temperature-only fallback,
# built to tell a purge problem from a temperature one. It did its job by never being needed: the
# one multicolour abort we chased turned out to be filament jammed on the spool, and the full path
# has since taken four-colour prints through twice. Upstream KAOS has no such switch either -- a
# KAOS user with an AMS always gets ORCA_PURGE -- so dropping it moves us closer to what KAOS is.
#
# A magic_stage left in variables.cfg from before is inert. It is not read any more, and a printer
# that had it set to 1 now takes the full path like everyone else.
#
# (Stage 2 in the original plan was the Z sandwich. Never implemented and not needed: the firmware's
#  spit macros make NO Z moves, so this path travels to the chute at print Z exactly as before --
#  lifted is always 0. The lift is a KAOS enhancement for tall prints that we do not adopt.)
[gcode_macro PHROZEN_TOOLCHANGE]
description: magic_ams tool-change entry - arms the ORCA_PURGE handoff and hands over to the spit tail
gcode:
    {% set ams = printer.save_variables.variables.ams|default(0)|int %}
    # Read the caller's extrusion mode once, before either branch touches it. Jinja renders the whole
    # body before the first command runs, so this is the mode on entry -- which is what both branches
    # need to hand back.
    {% set was_abs_e = printer.gcode_move.absolute_extrude %}
    {% if ams == 1 %}
        # ALWAYS drop a stale handoff first. A leftover active=1 from a tool change that
        # never reached its spit tail would otherwise fire ORCA_PURGE at the wrong moment.
        _TOOLCHANGE_CLEAR

        {% set flush = params.FLUSH|default(0)|float %}
        {% set retract = params.RETRACT|default(2)|float %}
        # Incoming-tool temp. Read GLOBAL_PARAM directly and fall back to the live
        # nozzle target, so next_temp is never 0 (which would make an M104 a cold purge).
        {% set gp_temp = printer["gcode_macro GLOBAL_PARAM"].g_extruder_temperature|float %}
        {% set cur = gp_temp if gp_temp > 0 else printer.extruder.target|float %}
        {% set temp = params.TEMP|default(0)|float %}
        {% set next_temp = temp if temp > 0 else cur %}

        # --- The per-tool temperature fix ----------------------------------
        # Phrozen sets g_extruder_temperature ONCE in PG103 at print start and the T<n>
        # path never refreshes it, so today every colour change after the first reheats
        # and restores to the FIRST tool's temperature. Writing the slicer-supplied temp
        # here is the whole fix: the stock spit tail already ends with
        # M104 S{g_extruder_temperature}, and PG101's chute pre-heat reads the same
        # global — so both follow the INCOMING tool for free, with no new state.
        # Only write a real value; never clobber the global with 0.
        {% if next_temp > 0 %}
            SET_GCODE_VARIABLE MACRO=GLOBAL_PARAM VARIABLE=g_extruder_temperature VALUE={next_temp}
        {% endif %}

        # Retract the outgoing filament before the firmware cut. M83 FIRST so the
        # retract is relative regardless of the caller's E mode - closing the kit's
        # standing "G1 E-1 before M83" latent defect on this path.
        M83
        G1 E-1 F3600
        # ...and hand the mode back. Setting M83 and keeping it would be worse than the defect it
        # fixes: a slicer running absolute E would have every extrusion after the first tool change
        # reinterpreted as relative, for the rest of the print.
        {% if was_abs_e %}M82{% endif %}

        # --- Stage 3: hand the purge to ORCA_PURGE --------------------
        # Refresh the fan/temp mirrors ORCA_PURGE restores at the end. Runs as a
        # command BEFORE ORCA_PURGE (which fires later, from PRZ_SPITTING_END), so
        # its writes are in effect by the time that reads them — and it now picks up
        # the g_extruder_temperature we just wrote.
        _ARCO_KAOS_STATE_SYNC

        # Arm the handoff. PRZ_SPITTING_END (below) consumes it at the tail of the
        # firmware prime and fires ORCA_PURGE with these values.
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_PENDING VARIABLE=flush     VALUE={flush}
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_PENDING VARIABLE=retract   VALUE={retract}
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_PENDING VARIABLE=next_temp VALUE={next_temp}
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_PENDING VARIABLE=lifted    VALUE=0
        # Stamp the print clock so a handoff cannot be redeemed by a LATER print.
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_PENDING VARIABLE=armed_at  VALUE={printer.print_stats.total_duration|default(0)|float}
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_PENDING VARIABLE=active    VALUE=1

        # Pin the prime bucket. P10 S2 -> PG112 = PRZ_SPITTING_START (58mm gears-to-
        # nozzle prime) + PRZ_SPITTING_END and NOTHING else. Every other bucket is
        # wrong here: S1/PG111 has no prime (purge would be air), S3+/PG113+ add
        # PRZ_SPITTING_NORMAL's ~135mm we cannot intercept (double purge). The bucket
        # is sticky per klippy session, so it MUST be re-sent on every change.
        P10 S2
    {% else %}
        # No AMS attached: the kit's manual-swap fallback. It used to be byte-identical to stock,
        # which is why it carried the bare retract; the kit has since fixed that, so this follows.
        M83
        G1 E-1 F3600
        {% if was_abs_e %}M82{% endif %}
        M118 No AMS -> manual filament change (M600: unload -> swap -> load -> purge -> resume)
        M600
    {% endif %}

# --- The consumer: PRZ_SPITTING_END (redeems the handoff -> ORCA_PURGE) ---
# On every firmware spit, PG11x calls PRZ_SPITTING_END. The sideload renames the
# kit's stock section to _ARCO_SPITTING_END_STOCK (one header-line sed in
# printer_gcode_macro.cfg, reverted on KAOS_OFF, re-applied by the boot guard), so
# THIS is the only PRZ_SPITTING_END declaration — no merge. Armed handoff ->
# ORCA_PURGE; otherwise -> the stock tail, verbatim under its new name.
#
# Why the sed rename and not `rename_existing`/merge here? Unlike PHROZEN_TOOLCHANGE
# (which we fully replace), the non-magic spit path (initial load, runout) still
# needs the stock body — so it must survive under a distinct name. rename_existing
# can't do it (config-section merge -> "Existing command not found"), and a plain
# re-declaration would strand the stock body. Renaming the stock section keeps it
# verbatim and callable. If the rename is missing (e.g. a Phrozen update reverted
# printer_gcode_macro.cfg before the guard re-applied it), we fail loud instead of
# silently skipping the stock spit.
[gcode_macro PRZ_SPITTING_END]
description: Phrozen spit tail + magic_ams handoff (stock body renamed to _ARCO_SPITTING_END_STOCK)
gcode:
    {% set P = printer["gcode_macro _TOOLCHANGE_PENDING"] %}
    # A handoff is armed and redeemed within one tool change, seconds apart. If a print is
    # CANCELLED in between, active=1 survives in klippy RAM and the next print's very first
    # spit (PG102, the initial load) would redeem it — a surprise purge with the previous
    # job's flush volume, and the stock prime skipped. print_stats.total_duration restarts
    # with every print, so comparing it against the stamp taken at arming distinguishes the
    # two: within one tool change the clock has advanced a little, whereas a new print reads
    # a much SMALLER value than the stamp left behind by the cancelled one.
    {% set now = printer.print_stats.total_duration|default(0)|float %}
    {% set armed = P.armed_at|default(0)|float %}
    {% set fresh = (now >= armed) and ((now - armed) < 300) %}
    {% if P is defined and P.active|int == 1 and not fresh %}
        # Stale: belongs to an earlier print. Drop it and fall through to the stock tail, so
        # this spit behaves exactly as it would without magic_ams.
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_PENDING VARIABLE=active VALUE=0
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_PENDING VARIABLE=lifted VALUE=0
        RESPOND PREFIX=KAOS MSG="dropped a tool-change handoff left over from an earlier print - running the normal spit."
        _ARCO_SPITTING_END_STOCK
    {% elif P is defined and P.active|int == 1 %}
        # Clear FIRST — the tail runs on every spit, so exactly one consumer may
        # ever win a queued handoff.
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_PENDING VARIABLE=active VALUE=0
        ORCA_PURGE FLUSH={P.flush} RETRACT={P.retract} TEMP={P.next_temp}
        # Mirror any lift the entry took (lifted=0 today, so this is a no-op;
        # kept wired for a Z-sandwich phase that was never adopted).
        {% if P.lifted|int == 1 %}
            SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_PENDING VARIABLE=lifted VALUE=0
            {% if 'z' in printer.toolhead.homed_axes %}
                G91
                G1 Z-{printer["gcode_macro PRZ_GEOMETRY"].toolchange_z_lift} F12000
                G90
            {% endif %}
        {% elif printer["gcode_macro _ARCO_SPITTING_END_STOCK"] is not defined %}
            RESPOND PREFIX=KAOS MSG="PRZ_SPITTING_END: _ARCO_SPITTING_END_STOCK missing - rename patch not applied. Restart to let the boot guard repair, or run KAOS_UPDATE."
        {% endif %}
    {% elif printer["gcode_macro _ARCO_SPITTING_END_STOCK"] is defined %}
        _ARCO_SPITTING_END_STOCK
    {% else %}
        # Rename patch missing AND no handoff: cannot run the stock spit tail. Say so
        # loudly rather than silently skipping the prime/purge. The boot guard
        # re-applies the rename on the next start.
        RESPOND PREFIX=KAOS MSG="PRZ_SPITTING_END: stock body missing (_ARCO_SPITTING_END_STOCK undefined) - rename patch not applied. Restart to let the boot guard repair."
    {% endif %}

# --- KAOS's TOOLCHANGE: left verbatim, deliberately NOT wrapped ----------
# Our print flow never calls KAOS's TOOLCHANGE — Orca calls PHROZEN_TOOLCHANGE,
# which we own above. We do NOT wrap TOOLCHANGE: it is a gcode_macro SECTION in
# magic_ams_by_chris.cfg, so a `rename_existing` wrapper would hit the same-named-
# section merge failure and stop Klipper from booting. Leaving it verbatim is safe:
# KAOS's TOOLCHANGE hard-requires a NEXT parameter (action_raise_error without one)
# and calls _REQUIRE_TRUSTED_XY, so a stray direct call on a no-AMS printer fails
# loud rather than lifting the head. A gated menu path, if ever needed, is a
# DIFFERENTLY-NAMED macro that forwards to TOOLCHANGE — never a same-named wrapper.

# --- Stale-handoff reset ------------------------------------------------
# Belt to the braces in PRZ_SPITTING_END: PHROZEN_TOOLCHANGE calls this at the START of
# every change, so a fresh change never inherits a leftover.
#
# The cancel-then-reprint window is closed separately, by the print-clock stamp checked in
# PRZ_SPITTING_END. That deliberately does NOT depend on this macro being wired into
# PRINT_START or CANCEL_PRINT: both live in files the kit owns, and the kit stays KAOS-free.
# Between the two, a stale handoff can neither survive into the next change nor be redeemed
# by a later print.
[gcode_macro _TOOLCHANGE_CLEAR]
description: Drop any stale magic_ams tool-change handoff
gcode:
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_PENDING VARIABLE=active VALUE=0
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_PENDING VARIABLE=lifted VALUE=0
