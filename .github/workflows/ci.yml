# CI — static checks only.
#
# What this can prove: the shell parses, the Python imports, the documents still point at each other,
# nothing obviously proprietary slipped in. What it CANNOT prove: that any of it works on an Arco.
# There is no hardware here, no image bake, no flash. A green tick means "worth testing", not "tested".
name: CI

on:
  push:
    # beta is a channel real printers follow, not a scratch branch: scripts/channel.sh points a tester's
    # clone at it and Moonraker updates from it. Anything landing here reaches hardware, so it gets the
    # same gates as main. `pull_request` below already covers PRs into either.
    branches: [main, beta, alpha]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Refuse alpha -> main, because GitHub keeps offering it. Every push to alpha raises a "Compare &
  # pull request" banner on the repository front page, and its button proposes a pull request into the
  # DEFAULT branch -- skipping beta, which is the whole point of having three channels.
  #
  # A mis-click there is not obviously wrong when you look at it: GitHub reported MERGEABLE / CLEAN for
  # a pull request on 2026-08-15 that carried a whole feature under the title of a README badge.
  # "Clean" means free of conflicts, not correct. So the check has to be mechanical.
  #
  # EVERY channel, not just alpha -> main. That narrower rule predates CONTRIBUTING.md saying
  # plainly that pull requests go to alpha and nowhere else, and the gap between the two is not
  # theoretical: a grouped dependency bump sat on 'Ready to merge' against main, because nothing
  # checked a head branch that was not called alpha. Merging it there would have put a commit on
  # main that beta and alpha lack, and the next promotion would have stopped being a
  # fast-forward. Promotions are pushes, never pull requests, so nothing legitimate is blocked.
  channel-order:
    name: Channel order
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'beta')
    steps:
      - name: pull requests go to alpha
        run: |
          echo "::error::Pull requests go to 'alpha'. This one targets '${{ github.base_ref }}'."
          echo "A change moves alpha -> beta -> main, and those two steps are fast-forward pushes by a"
          echo "maintainer, never merges. Merging here would leave commits on '${{ github.base_ref }}'"
          echo "that the branches above it do not have, and the next promotion would stop being a"
          echo "fast-forward -- the breakage CONTRIBUTING.md describes under 'Where a change lands'."
          echo ""
          echo "Re-target this pull request at 'alpha'. To promote what is already there:"
          echo "  git push origin origin/alpha:refs/heads/beta"
          echo "  git push origin origin/beta:refs/heads/main"
          exit 1

  # The three channels only work while they are one line: main an ancestor of beta, beta of alpha. That
  # is what makes every promotion a plain fast-forward, and it is why none of them ever needs a force
  # push -- which they are protected against, for the reason recorded in channel.sh.
  #
  # It broke on 2026-08-15, quietly and from something harmless: a Ko-fi link was merged straight into
  # main. Three files, not one line of code, and afterwards main carried two commits the channels did
  # not. The next promotion would have refused to fast-forward, and the obvious way out of that is
  # exactly the force push that costs testers their clones. Nothing warned; it was noticed by looking.
  #
  # The repair is never a rewrite -- merge main back DOWN into beta and alpha. This says so.
  channel-chain:
    name: Channel chain
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'beta')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: main is an ancestor of beta, beta of alpha
        run: |
          for b in main beta alpha; do
            git fetch --quiet --no-tags origin "$b:refs/remotes/origin/$b" 2>/dev/null || true
          done
          fail=0
          check() {   # $1 = the calmer channel, $2 = the one downstream of it
            git rev-parse --verify -q "origin/$1" >/dev/null || return 0
            git rev-parse --verify -q "origin/$2" >/dev/null || return 0
            git merge-base --is-ancestor "origin/$1" "origin/$2" && return 0
            echo "::error::$1 carries $(git rev-list --count "origin/$2..origin/$1") commit(s) that $2 does not, so $2 -> $1 is no longer a fast-forward."
            git log --oneline --no-decorate "origin/$2..origin/$1" | sed 's/^/  /'
            echo "  Repair by merging DOWN, never by rewriting:"
            echo "    git fetch origin && git checkout -B _sync origin/$2 && git merge --no-ff origin/$1"
            echo "    git push origin _sync:refs/heads/$2"
            fail=1
          }
          check main beta
          check beta alpha
          [ "$fail" = 0 ] && echo "Channels are in one line: main -> beta -> alpha."
          exit "$fail"

  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Absolute gate. A shell script in this kit runs as root on someone else's printer; one that
      # does not even parse has no business being on main.
      - name: Syntax (bash -n)
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "::error file=$f::does not parse"; fail=1; }
          done < <(git ls-files '*.sh')
          if [ "$fail" = 0 ]; then echo "All $(git ls-files '*.sh' | wc -l) shell scripts parse."; fi
          exit "$fail"

      # The self-flash bundle is assembled BY HAND and has already shipped stale three times. It now
      # carries its own copy of collect_data_arco.sh, because install-unleashed.sh collects the AMS
      # files itself while the original system is still standing. A copy that quietly drifts from the
      # one in the repository root would ship a flasher rescuing files with last month's logic, and
      # nothing on the printer would say so. Byte-identical or the build stops.
      - name: Self-flash bundle carries the same collector
        run: |
          if ! cmp -s collect_data_arco.sh selfflash/collect_data_arco.sh; then
            echo "::error file=selfflash/collect_data_arco.sh::drifted from collect_data_arco.sh"
            diff -u collect_data_arco.sh selfflash/collect_data_arco.sh || true
            echo
            echo "Copy it over:  cp collect_data_arco.sh selfflash/collect_data_arco.sh"
            exit 1
          fi
          echo "selfflash/collect_data_arco.sh is byte-identical to the root copy."

      # A guard with no off switch is a decision made for the owner, which is the one thing
      # guards-toggle.sh exists to prevent. check-guards.sh derives its list from optimize-boot.sh and
      # cannot fall behind; the toggle screen's table is hand-written, because "what breaks without
      # this" cannot be derived -- and it had fallen four guards behind before anyone noticed.
      - name: Every guard has an off switch
        run: bash .github/ci/check-guards-toggle.sh

      - name: Ensure shellcheck
        run: command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y shellcheck; }

      # Error severity only, measured against a baseline of known-and-explained findings, so this
      # fails on something NEW rather than on the backlog. See .github/ci/shellcheck-baseline.txt.
      - name: ShellCheck (errors, vs baseline)
        run: |
          shellcheck -f gcc -S error -- $(git ls-files '*.sh') 2>/dev/null \
            | sed -E 's/^([^:]+):[0-9]+:[0-9]+: [a-z]+: .*\[(SC[0-9]+)\]$/\1 \2/' \
            | sort -u > /tmp/sc-current.txt || true
          grep -vE '^\s*(#|$)' .github/ci/shellcheck-baseline.txt | sort -u > /tmp/sc-baseline.txt
          new="$(comm -13 /tmp/sc-baseline.txt /tmp/sc-current.txt)"
          if [ -n "$new" ]; then
            echo "New error-severity findings (not in the baseline):"
            echo "$new" | sed 's/^/  /'
            echo
            echo "Fix them, or add the line to .github/ci/shellcheck-baseline.txt with the reason."
            exit 1
          fi
          echo "No new error-severity findings."

      # The rest of the backlog: reported, never blocking. It is a to-do list, not a verdict.
      - name: ShellCheck backlog (report only)
        if: always()
        run: |
          {
            echo "### ShellCheck backlog"
            echo
            echo "Warning severity and above, excluding what already passed the gate above."
            echo
            echo '```'
            shellcheck -f gcc -S warning -- $(git ls-files '*.sh') 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # The extras in scripts/ are imported by Klipper itself at startup. A syntax error there does
      # not produce a broken feature -- it produces a printer that does not come up.
      - name: Compile
        run: |
          fail=0
          while IFS= read -r f; do
            python -m py_compile "$f" || { echo "::error file=$f::does not compile"; fail=1; }
          done < <(git ls-files '*.py')
          if [ "$fail" = 0 ]; then echo "All $(git ls-files '*.py' | wc -l) Python files compile."; fi
          exit "$fail"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Anchors and step numbers
        run: python3 .github/ci/check-docs.py

      # A marker that resolves to nothing is refused on the printer and silent to whoever wrote it:
      # the message goes to a journal in somebody's workshop, not to the pull request. The P114 gate
      # ran two versions out of date for months for that kind of reason. Same rules, checked here.
      - name: AddOn.cfg markers
        run: python3 .github/ci/check-addon-markers.py

      # The documents overlap on purpose and drift for free. This fails on text that has quietly
      # acquired a second owner, and -- when there is a base commit to compare against -- points out
      # sentences elsewhere that closely matched the wording just changed here. The second half is a
      # note, not a failure: QUICKSTART restating MANUAL is what QUICKSTART is for.
      - name: Documents telling the same thing twice
        run: |
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No usable base commit — running the duplication check only."
            python3 .github/ci/check-docs-drift.py
          else
            python3 .github/ci/check-docs-drift.py --base "$base"
          fi

      # The .html files are generated from the markdown with pandoc and shipped on the USB stick --
      # read exactly when the reader has no network to check anything against. A QUICKSTART.html six
      # days older than QUICKSTART.md has already gone out once. Hard failure on main, where the
      # maintainer owns both halves; a note on pull requests, where contributors are asked to change
      # only the markdown and leave regeneration to a maintainer.
      - name: Markdown / HTML drift
        run: |
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to compare against — skipped."; exit 0
          fi
          # The base can be named and still be gone. After a force push, github.event.before is the
          # commit the branch used to be at, which a rewritten history no longer contains -- git then
          # exits 128 on "bad object" and fails the run for a reason that has nothing to do with the
          # documents. There is genuinely nothing to compare in that case, so say so and move on.
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "Base commit $base is not in this history (force push?) — skipped."; exit 0
          fi
          changed="$(git diff --name-only "$base" '${{ github.sha }}')"
          drift=0
          for d in README MANUAL QUICKSTART; do
            echo "$changed" | grep -qx "$d.md"   || continue
            echo "$changed" | grep -qx "$d.html" && continue
            drift=1
            if [ '${{ github.event_name }}' = pull_request ]; then
              echo "::notice file=$d.md::$d.md changed but $d.html did not — a maintainer regenerates it (pandoc)."
            else
              echo "::error file=$d.md::$d.md changed but $d.html did not. Run image-toolbox/build-docs-html.sh."
            fi
          done
          if [ "$drift" = 1 ] && [ '${{ github.event_name }}' != pull_request ]; then exit 1; fi
          if [ "$drift" = 0 ]; then echo "Markdown and HTML are in step."; fi
          exit 0
