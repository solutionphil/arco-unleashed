# ──────────────────────────────────────────────────────────────
# Arco Unleashed — Mainsail theme cycle macro
# Requires: klippy/extras/gcode_shell_command.py  AND  the variant
# tree (.theme-variants/) + unleashed-theme.sh in printer_data/config/.
# Add to printer.cfg:   [include unleashed-theme-macros.cfg]
#
# One button cycles the look:  Bright -> Dark -> Stock -> Bright ...
# The last state is remembered across restarts (.theme-state).
# ──────────────────────────────────────────────────────────────

[gcode_shell_command switch_theme]
command: sh /home/mks/printer_data/config/unleashed-theme.sh
timeout: 15.
verbose: True

[gcode_macro SWITCH_THEME]
description: Cycle Mainsail theme: Bright -> Dark -> Stock
gcode:
    RUN_SHELL_COMMAND CMD=switch_theme PARAMS=next
    {action_respond_info("Theme switched - see console. Reload Mainsail (Ctrl+F5)")}
